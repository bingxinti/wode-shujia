<script>
try {
  var themeIds = { sepia: 1, blush: 1, green: 1, lake: 1, mist: 1, lilac: 1, snow: 1, white: 1, marker: 1, night: 1, candle: 1, pine: 1, navy: 1, ios: 1, mac: 1, wechat: 1, qq: 1, bili: 1, douyin: 1, xhs: 1, zhihu: 1, weibo: 1 };
  var darkIds = { night: 1, candle: 1, pine: 1, navy: 1, douyin: 1 };
  var accentToTheme = { blue: "ios", wechat: "wechat", bili: "bili", qq: "qq" };
  var savedTheme = localStorage.getItem("zhishi-theme");
  var savedAccent = localStorage.getItem("zhishi-accent");
  if (!(savedTheme && themeIds[savedTheme]) && savedAccent && accentToTheme[savedAccent]) {
    savedTheme = accentToTheme[savedAccent];
    localStorage.setItem("zhishi-theme", savedTheme);
  }
  if (savedAccent) localStorage.removeItem("zhishi-accent");
  localStorage.removeItem("zhishi-style");
  document.documentElement.removeAttribute("data-accent");
  document.documentElement.removeAttribute("data-style");
  if (savedTheme && themeIds[savedTheme]) {
    document.documentElement.setAttribute("data-theme", savedTheme);
    if (darkIds[savedTheme]) document.documentElement.setAttribute("data-tone", "dark");
  }
} catch (e) {}

async function writeClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.top = "0";
  area.style.insetInlineStart = "0";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.focus();
  area.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  area.remove();
  return ok;
}

    if (btn) {

    clearTimeout(copiedTimer);

      if (!again) return;

      again.classList.remove("is-done");
    }, 1600);
  });
}

    const century = value < 0 ? Math.ceil(Math.abs(value) / 100) : Math.floor((value - 1) / 100) + 1;
    text = t(value < 0 ? "centuryBCE" : "centuryCE", { y: century });
  } else {

  }

}

function aboutPair(explain, state) {
  return `<div class="about-pair"><div class="about-explain"><p class="about-k">${esc(t("aboutExplain"))}</p><p>${esc(explain)}</p></div><div class="about-state"><p class="about-k">${esc(t("aboutState"))}</p><p>${esc(state)}</p></div></div>`;
}
function aboutToc(nodes, depth) {
  const items = nodes.map(node => {
    const kids = node.children || [];
    const cls = depth === 0 ? "is-plate" : "";
    const sub = kids.length ? aboutToc(kids, depth + 1) : "";
    return `<li><button type="button" class="${cls}" data-about-jump="about-${esc(node.id)}">${esc(nodeName(node))}</button>${sub}</li>`;
  }).join("");
  return `<ul>${items}</ul>`;
}
function aboutSection(node, depth) {
  const pack = ABOUT[node.id] || {};
  const explain = pack.explain || nodeNote(node);
  const state = pack.state || "";
  const kids = node.children || [];
  const tag = depth === 0 ? "h2" : depth === 1 ? "h3" : "h4";
  const kind = t(ABOUT_KIND[depth] || "aboutClass");
  const childHtml = kids.length ? `<div class="about-children">${kids.map(child => aboutSection(child, depth + 1)).join("")}</div>` : "";
  return `<section class="about-node about-d${depth}" id="about-${esc(node.id)}"><header><p class="about-kind">${esc(kind)}</p><${tag}>${esc(nodeName(node))}</${tag}></header>${aboutPair(explain, state)}${childHtml}</section>`;
}

  const prev = $("pic-lightbox-prev");

  if (prev && next) {
    prev.style.display = n > 1 ? "" : "none";
    next.style.display = n > 1 ? "" : "none";
    prev.disabled = picLightboxIndex <= 0;
    next.disabled = picLightboxIndex >= n - 1;

}
function stepPicLightbox(delta) {
  const n = picLightboxItems.length;

function syncThemeColor() {

function applyTheme(id, persist) {
  const theme = THEMES.includes(id) ? id : "paper";
  applyTone(theme);
  if (theme === "paper") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-theme-pick]").forEach(btn => {
    btn.setAttribute("aria-checked", btn.dataset.themePick === theme ? "true" : "false");
  });
  syncThemeColor();

}
function themeOpen() { return !$("theme-menu").hidden; }
function placeThemeMenu() {
  const menu = $("theme-menu");
  if (menu.hidden) return;
  const btn = $("theme-btn").getBoundingClientRect();
  const room = Math.max(0, window.innerHeight - btn.bottom - 16);
  menu.style.maxHeight = Math.min(520, room) + "px";
  menu.style.transform = "";
  const box = menu.getBoundingClientRect();
  if (box.left < 8) menu.style.transform = "translateX(" + (8 - box.left) + "px)";
  else if (box.right > window.innerWidth - 8) menu.style.transform = "translateX(" + (window.innerWidth - 8 - box.right) + "px)";
}

function feedbackUrl() {

  }
  return "http://127.0.0.1:8791/api/feedback";
}
function formatWhen(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso || "");
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function setFeedbackStatus(text) { $("feedback-status").textContent = text; }
function feedbackError(data) {
  const known = {
    "白板读不出来。": "feedbackReadFail",
    "没有这个地址。": "feedbackFail",
    "内容没送成。": "feedbackBad",
    "称呼太长。": "feedbackNameLong",
    "内容太长。": "feedbackTextLong",
    "写点内容再送。": "feedbackNeedText",
    "白板没有写成。": "feedbackWriteFail",
  };
  const key = known[data && data.error];
  return t(key || "feedbackFail");
}
function noteIp(note) {
  const ip = note && note.ip;
  return typeof ip === "string" ? ip.trim() : "";
}
function feedbackIsMine(note) {
  const ip = noteIp(note);
  return Boolean(feedbackIp) && ip === feedbackIp;
}
function feedbackBucket(tab) {
  return feedbackNotes.filter(note => note && note.text).filter(note => {
    const mine = feedbackIsMine(note);
    return tab === "mine" ? mine : !mine;
  });
}
function paintFeedbackChrome() {
  const publicCount = feedbackBucket("public").length;
  const mineCount = feedbackBucket("mine").length;
  const pub = $("feedback-tab-public");
  const mine = $("feedback-tab-mine");
  if (pub) {
    pub.textContent = t("feedbackPublic") + " " + publicCount;
    pub.setAttribute("aria-selected", feedbackTab === "public" ? "true" : "false");
  }
  if (mine) {
    mine.textContent = t("feedbackMine") + " " + mineCount;
    mine.setAttribute("aria-selected", feedbackTab === "mine" ? "true" : "false");
  }
  const ipEl = $("feedback-ip");

  const tabs = document.querySelector(".feedback-tabs");
  if (tabs) tabs.setAttribute("aria-label", t("feedbackTabs"));
}
function renderFeedback() {
  paintFeedbackChrome();
  const notes = feedbackBucket(feedbackTab).slice().sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
  const list = $("feedback-list");
  if (!notes.length) {
    const emptyKey = feedbackTab === "mine"
      ? (feedbackIp ? "feedbackEmptyMine" : "feedbackEmptyMineOffline")
      : "feedbackEmptyPublic";
    list.innerHTML = `<p class="feedback-empty">${esc(t(emptyKey))}</p>`;
    return;
  }
  list.innerHTML = notes.map(note => {
    const name = String(note.name || "").trim() || t("feedbackAnon");
    const ip = noteIp(note);
    const ipLine = ip ? t("feedbackIpLabel", { ip }) : t("feedbackIpMissing");
    return `<article class="note"><div class="note-top"><span class="note-name">${esc(name)}</span><time datetime="${esc(note.at || "")}">${esc(formatWhen(note.at))}</time></div><p class="note-ip">${esc(ipLine)}</p><p>${esc(note.text)}</p></article>`;
  }).join("");

function feedbackCountStatus() {
  const n = feedbackBucket(feedbackTab).length;

}
function setFeedbackTab(tab) {
  feedbackTab = tab === "mine" ? "mine" : "public";

  setFeedbackStatus(feedbackCountStatus());
}
async function pullFeedback() {
  try {
    const res = await fetch(feedbackUrl(), { cache: "no-store" });
    if (!res.ok) throw new Error("status");
    const data = await res.json();
    if (!data || !Array.isArray(data.notes)) throw new Error("shape");
    feedbackNotes = data.notes;
    if (typeof data.ip === "string") feedbackIp = data.ip.trim();
    renderFeedback();
    setFeedbackStatus(feedbackCountStatus());
  } catch (e) {
    renderFeedback();
    setFeedbackStatus(t("feedbackOffline"));
  }
}

  $("open-feedback").setAttribute("aria-expanded", "true");
  pullFeedback();
  clearInterval(feedbackTimer);
  feedbackTimer = setInterval(pullFeedback, 8000);
  $("feedback-text").focus();
}

  $("feedback-panel").hidden = true;
  $("open-feedback").setAttribute("aria-expanded", "false");
  clearInterval(feedbackTimer);

  if (restoreFocus) $("open-feedback").focus();
}
async function submitFeedback() {
  const name = $("feedback-name").value.trim();
  const text = $("feedback-text").value.trim();
  if (!text) {
    setFeedbackStatus(t("feedbackNeedText"));
    $("feedback-text").focus();
    return;
  }
  if (feedbackSending) return;
  feedbackSending = true;
  const btn = $("feedback-form").querySelector("button[type=submit]");
  btn.disabled = true;
  setFeedbackStatus(t("feedbackSending"));
  try {
    const res = await fetch(feedbackUrl(), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, text })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data || !Array.isArray(data.notes)) {
      setFeedbackStatus(feedbackError(data));
      return;
    }
    feedbackNotes = data.notes;
    if (typeof data.ip === "string" && data.ip.trim()) feedbackIp = data.ip.trim();
    feedbackTab = "mine";
    $("feedback-text").value = "";
    renderFeedback();
    setFeedbackStatus(t("feedbackDone"));
    $("feedback-list").scrollTop = 0;
  } catch (e) {
    setFeedbackStatus(t("feedbackUnsent"));
  } finally {
    feedbackSending = false;
    btn.disabled = false;
  }
}

}
function setLang(code) {
  if (!LANG_BY_ID[code] || code === lang) return;
  lang = code;
  rememberLang();
  applyChrome();
  writeHash();
  render();
  renderAbout();
  renderFeedback();
  if (feedbackOpen()) pullFeedback();
}
$("lang").addEventListener("change", () => setLang($("lang").value));
window.addEventListener("resize", () => {
  if (orderOpen && wideReading()) setOrder(false, false);
  syncWindowLock();
  syncSidePins();
  syncOrderToReading(true);
  placeThemeMenu();
});
$("detail").addEventListener("scroll", queueOrderSync, { passive: true });
window.addEventListener("scroll", queueOrderSync, { passive: true });
// 手机端：向下滚动时把“意见反馈”悬浮按钮收起，避免遮挡卡片内容；向上滚动时重新出现
let fabLastY = window.scrollY;
window.addEventListener("scroll", () => {
  const fab = $("open-feedback");
  if (!fab || window.innerWidth > 860) return;
  if (fab.getAttribute("aria-expanded") === "true") return;
  const y = window.scrollY;
  if (y > fabLastY + 8 && y > 120) fab.classList.add("is-hidden");
  else if (y < fabLastY - 8 || y <= 120) fab.classList.remove("is-hidden");
  fabLastY = y;
}, { passive: true });
window.addEventListener("storage", ev => {
  if (ev.key !== FAV_KEY) return;
  loadFavs();
  if (favClearOpen() && favs.size <= 3) $("fav-clear-layer").hidden = true;
  render();
  paintFavClear();
});
window.addEventListener("hashchange", () => {
  readHash();
  applyChrome();
  syncInsight();
  scrollResults = true;
  render();
  renderFeedback();
});

DIMS = (window.ZHISHI_DIMENSIONS && window.ZHISHI_DIMENSIONS.dimensions) || [];
BOOKS = window.ZHISHI_BOOKS || [];
COVER_IDS = new Set(window.ZHISHI_COVERS || []);
NAV = (window.ZHISHI_NAV && window.ZHISHI_NAV.tree) || [];
lang = storedLang();
if (!DIMS.length || !BOOKS.length || !NAV.length) {
  applyChrome();
  $("detail").innerHTML = `<p class="empty">${esc(t("loadError"))}</p>`;
} else {
  indexNames();
  loadFavs();
  readHash();
  applyChrome();
  writeHash();
  render();
  renderAbout();
  syncInsight();
}
applyTheme(document.documentElement.getAttribute("data-theme") || "paper", false);
renderFeedback();
pullFeedback();
</script>
</body>
</html>
